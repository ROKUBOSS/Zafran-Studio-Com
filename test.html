<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Portfolio</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 15px;
}

/* Normal View */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
}

.card {
    border: 1px solid #ccc;
    padding: 10px;
}

.image-group img {
    width: 100%;
    height: 200px;
    object-fit: contain;
}

/* ================= PRINT STYLE ================= */
@media print {

    body {
        margin: 0;
        padding: 0;
    }

    h2, .name {
        display: none; /* hide text */
    }

    .container {
        display: block;
    }

    .card {
        border: none;
        padding: 0;
        margin: 0;
    }

    .image-group {
        display: block;
    }

    .image-group img {
        width: 100vw;        /* full width */
        height: 100vh;       /* full height */
        object-fit: contain; /* full image visible */
        page-break-after: always; /* one image per page */
    }
}
</style>

</head>

<body>

<h2>Model Portfolio</h2>

<div class="container">

    <div class="card">
        <div class="name">Model Name</div>
        <div class="image-group">
            <img src="models/Maftuha Jannat Jim.jpeg">
            <img src="models/marufajim1.jpeg">
            <img src="models/marufajim2.jpeg">
        </div>
    </div>

</div>

</body>
</html>
