<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, print-scale: 100%, user-scalable=yes">
    <title>মডেল পোর্টফোলিও — ফুল রেসপন্সিভ | পোর্ট্রেট বা ল্যান্ডস্কেপ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ----- স্ক্রিন ভিউ স্টাইল (প্রিভিউ) ----- */
        body {
            font-family: 'Segoe UI', 'Roboto', 'Noto Sans Bengali', system-ui, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f5f7fc 0%, #eef2f8 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .screen-header {
            max-width: 1400px;
            margin: 0 auto 30px auto;
            text-align: center;
            padding: 20px 15px 15px 15px;
            border-bottom: 2px solid #ddd;
        }
        .screen-header h1 {
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            font-weight: 700;
            color: #1E2A3A;
            line-height: 1.3;
        }
        .screen-header p {
            font-size: clamp(0.85rem, 3vw, 1rem);
            color: #4a627a;
            margin-top: 10px;
            padding: 0 10px;
        }
        .badge {
            background: linear-gradient(135deg, #2c3e66, #1a2a4a);
            color: white;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: clamp(0.7rem, 2.5vw, 0.85rem);
            margin-top: 12px;
            font-weight: 500;
        }
        .instruction-box {
            background: #e8f0fe;
            padding: 12px 20px;
            border-radius: 16px;
            margin-top: 18px;
            font-size: clamp(0.8rem, 2.8vw, 0.9rem);
            color: #1a4d8c;
            text-align: left;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
        }
        .instruction-box code {
            background: #fff;
            padding: 2px 6px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            word-break: break-word;
        }

        /* ========== 📱 রেসপন্সিভ গ্রিড ========== */
        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ট্যাবলেটের জন্য */
        @media (min-width: 768px) and (max-width: 1024px) {
            .models-grid {
                grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                gap: 28px;
            }
        }

        /* মোবাইলের জন্য */
        @media (max-width: 640px) {
            .models-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            body {
                padding: 12px;
            }
        }

        .model-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 28px -8px rgba(0,0,0,0.12);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        .model-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 32px -12px rgba(0,0,0,0.2);
        }

        /* ========== 🎯 রেসপন্সিভ মডেলের নাম - এটাই মূল সমাধান ========== */
        .model-name {
            padding: 14px 16px;
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
        }

        .model-name h3 {
            font-size: clamp(1rem, 4vw, 1.2rem);
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 6px;
            color: #0f172a;
            word-break: break-word;
            letter-spacing: -0.2px;
        }

        .model-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .model-number {
            display: inline-block;
            background: #e2e8f0;
            color: #1e293b;
            font-size: clamp(0.65rem, 2.5vw, 0.75rem);
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 30px;
            letter-spacing: 0;
        }

        .image-count {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            font-size: clamp(0.65rem, 2.5vw, 0.75rem);
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 30px;
        }

        /* ছবির স্টাইল - সম্পূর্ণ রেসপন্সিভ */
        .image-strip {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 18px;
            background: #fafcff;
            flex: 1;
        }

        .image-container {
            position: relative;
            width: 100%;
            background: #eef2f8;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
        }

        /* ছবি সম্পূর্ণ দেখানোর মূল ম্যাজিক */
        .responsive-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            object-position: center;
            max-height: 380px;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        /* ট্যাবলেট ও মোবাইলে ছবির উচ্চতা কমানো */
        @media (max-width: 768px) {
            .responsive-img {
                max-height: 320px;
            }
            .image-strip {
                padding: 14px;
                gap: 14px;
            }
            .image-container {
                min-height: 180px;
            }
        }

        @media (max-width: 480px) {
            .responsive-img {
                max-height: 280px;
            }
            .image-strip {
                padding: 12px;
                gap: 12px;
            }
            .model-name {
                padding: 12px 14px;
            }
        }

        /* খুব বড় স্ক্রিনের জন্য */
        @media (min-width: 1600px) {
            .responsive-img {
                max-height: 450px;
            }
        }

        /* ========== 🖨️ প্রিন্ট স্টাইল ========== */
        @media print {
            body {
                background: white;
                padding: 0;
                margin: 0;
            }

            .screen-header,
            .badge,
            .instruction-box {
                display: none !important;
            }

            .models-grid {
                display: block !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .model-card {
                display: block !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
                page-break-inside: avoid;
                break-inside: avoid;
            }

            .model-name {
                display: none !important;
            }

            .image-strip {
                display: block !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .image-container {
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
                page-break-after: always !important;
                break-after: page !important;
                min-height: 100vh !important;
                width: 100% !important;
            }

            .responsive-img {
                display: block !important;
                width: auto !important;
                height: auto !important;
                max-width: 100vw !important;
                max-height: 100vh !important;
                object-fit: contain !important;
                object-position: center !important;
                margin: 0 auto !important;
                padding: 0 !important;
                border-radius: 0 !important;
            }

            @page {
                size: portrait;
                margin: 0cm !important;
            }

            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                background: white;
            }
        }
    </style>
</head>

    // প্লেসহোল্ডার ইমেজ (যখন ছবি নেই)
    function getPlaceholderImageURL(modelIndex, imageIndex, modelName) {
        const colors = ['#B2A4FF', '#FFB4A2', '#A7E0E0', '#FFC8DD', '#CDE990', '#F9D8C6', '#C0D6E8', '#FADADD', '#C9E4DE', '#DCCCA3'];
        const bgColor = colors[modelIndex % colors.length];
        const safeName = modelName.length > 30 ? modelName.substring(0, 27) + '...' : modelName;
        const svgString = `
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
            <rect width="800" height="1200" fill="${bgColor}" />
            <circle cx="400" cy="300" r="100" fill="rgba(255,255,255,0.4)" stroke="white" stroke-width="2"/>
            <text x="400" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="bold" fill="#2C3E50" text-anchor="middle">📷 পোর্টফোলিও</text>
            <text x="400" y="310" font-family="'Segoe UI', Arial, sans-serif" font-size="26" fill="#1F2A3E" text-anchor="middle" font-weight="600">${safeName}</text>
            <rect x="280" y="440" width="240" height="50" rx="25" fill="white" opacity="0.85" />
            <text x="400" y="474" font-family="monospace" font-size="22" fill="#111" text-anchor="middle" font-weight="bold">ছবি ${imageIndex + 1} / ৩</text>
            <text x="400" y="1000" font-family="Arial" font-size="20" fill="rgba(0,0,0,0.5)" text-anchor="middle">মডেল ${modelIndex + 1} / ৫০</text>
        </svg>`;
        return `data:image/svg+xml,${encodeURIComponent(svgString)}`;
    }
    
    // রেন্ডার ফাংশন
    function renderModels() {
        const container = document.getElementById('modelsContainer');
        if (!container) return;
        
        container.innerHTML = '';
        
        modelsData.forEach((model, modelIdx) => {
            const card = document.createElement('div');
            card.className = 'model-card';
            
            // 🎯 রেসপন্সিভ নামের সেকশন - আপগ্রেড
            const nameDiv = document.createElement('div');
            nameDiv.className = 'model-name';
            
            const nameHeading = document.createElement('h3');
            nameHeading.textContent = `${modelIdx + 1}. ${model.name}`;
            
            const statsDiv = document.createElement('div');
            statsDiv.className = 'model-stats';
            
            const numberSpan = document.createElement('span');
            numberSpan.className = 'model-number';
            numberSpan.textContent = `#${modelIdx + 1}`;
            
            const countSpan = document.createElement('span');
            countSpan.className = 'image-count';
            countSpan.textContent = `📸 ${model.images.length} ছবি`;
            
            statsDiv.appendChild(numberSpan);
            statsDiv.appendChild(countSpan);
            
            nameDiv.appendChild(nameHeading);
            nameDiv.appendChild(statsDiv);
            
            // ছবির স্ট্রিপ
            const imageStrip = document.createElement('div');
            imageStrip.className = 'image-strip';
            
            model.images.forEach((imgPath, imgIdx) => {
                const imgContainer = document.createElement('div');
                imgContainer.className = 'image-container';
                
                const img = document.createElement('img');
                img.className = 'responsive-img';
                img.src = imgPath;
                img.alt = `${model.name} - ছবি ${imgIdx + 1}`;
                img.loading = 'lazy';
                
                img.onerror = function() {
                    if (!this.dataset.fallbackSet) {
                        this.dataset.fallbackSet = "true";
                        this.src = getPlaceholderImageURL(modelIdx, imgIdx, model.name);
                    }
                };
                
                imgContainer.appendChild(img);
                imageStrip.appendChild(imgContainer);
            });
            
            card.appendChild(nameDiv);
            card.appendChild(imageStrip);
            container.appendChild(card);
        });
        
        console.log(`✅ ${modelsData.length}টি মডেল রেসপন্সিভভাবে লোড হয়েছে`);
        console.log(`📸 মোট ছবি: ${modelsData.length * 3}টি | 📱 সব ডিভাইসে সাজানো`);
    }
    
    window.addEventListener('DOMContentLoaded', renderModels);
</script>
