<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Portfolio</title>

<style>
body {
    font-family: Arial;
    margin: 20px;
}

h2 {
    text-align: center;
}

/* Grid Layout */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
}

/* Card */
.card {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: center;
}

/* Images */
.card img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    margin-bottom: 5px;
}

/* Name */
.name {
    font-weight: bold;
}

/* Print Style */
@media print {
    .container {
        grid-template-columns: repeat(3, 1fr);
    }
}
</style>

</head>

<body>
