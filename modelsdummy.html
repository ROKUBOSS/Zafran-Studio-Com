<title>Model Portfolio</title>

<style>
body {
    font-family: Arial;
    margin: 10px;
}

h2 {
    text-align: center;
}

/* Default (PC view) */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
}

.card {
    border: 1px solid #ccc;
    padding: 5px;
    text-align: center;
}

.image-box {
    width: 100%;
    height: 150px;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 5px;
}

.image-box img {
    max-width: 100%;
    max-height: 100%;
}

.name {
    font-weight: bold;
}

/* 🔥 Mobile View */
@media (max-width: 600px) {

    .container {
        grid-template-columns: 1fr;
    }

    .image-box {
        height: auto;
    }

    .image-box img {
        width: 100%;
        height: auto;
    }
}

/* Print */
@media print {
    .container {
        grid-template-columns: repeat(3, 1fr);
    }
}
</style>

</head>
